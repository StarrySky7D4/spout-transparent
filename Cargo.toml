[workspace]
members = ["lib", "lib/c-api", "bin"]
default-members = ["lib", "bin"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/StarrySky7D4/spout-transparent"

[workspace.dependencies]
spout-transparent = { path = "lib", version = "0.1.0" }
windows = { version = "0.58" }
raw-window-handle = "0.6"
winit = "0.30.0"
windows-sys = { version = "0.59" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.9"
thiserror = "1"
