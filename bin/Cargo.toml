[package]
name = "spout-transparent-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transparent desktop application built on the spout-transparent library"
publish = false

[[bin]]
name = "spout-transparent"
path = "src/main.rs"

[dependencies]
spout-transparent.workspace = true
raw-window-handle.workspace = true
winit.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Threading", "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
] }

[[bench]]
name = "performance"
harness = false
