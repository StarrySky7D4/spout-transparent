[package]
name = "spout-transparent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable Windows Spout DX11 receiver, alpha readback and crop primitives"
readme = "README.md"
keywords = ["spout", "direct3d", "windows", "transparency"]
categories = ["multimedia::video", "os::windows-apis"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
log.workspace = true
thiserror.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition", "Win32_System_Com", "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Memory", "Win32_System_Threading",
] }
